<!doctype html>
<html
  lang="es"
  data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Oscar Leites — Música, Soundtracks & Análisis</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./img/favicon.ico" />
    <meta
      name="description"
      content="Oscar Leites: soundtracks para videojuegos, análisis musical, adaptaciones a instrumentos del mundo y contenido en YouTube." />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <style>
            :root{
              --bg:#0b0f1a; --bg2:#111827; --card:#151d2e; --text:#e8ecf4; --muted:#9aa7bd;
              --accent:#7c5cff; --accent2:#00d4b8; --border:rgba(255,255,255,.09);
              --shadow:0 12px 40px rgba(0,0,0,.45); --radius:18px;
            }
            [data-theme="light"]{
              --bg:#f6f7fb; --bg2:#ffffff; --card:#ffffff; --text:#141a26; --muted:#5b6577;
              --accent:#5b3df0; --accent2:#00917d; --border:rgba(20,26,38,.1);
              --shadow:0 12px 34px rgba(20,26,38,.1);
            }
            *{margin:0;padding:0;box-sizing:border-box}
            html{scroll-behavior:smooth}
            body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .35s,color .35s}
            h1,h2,h3,h4{font-family:'Sora',sans-serif;line-height:1.15}
            a{color:inherit;text-decoration:none}
            img{max-width:100%;display:block}
            .container{width:min(1120px,92%);margin:0 auto}
            section{padding:88px 0}
            .kicker{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:600;margin-bottom:12px}
            .section-title{font-size:clamp(1.7rem,3.4vw,2.5rem);margin-bottom:14px}
            .lead{color:var(--muted);max-width:640px}

            /* ===== NAV ===== */
            nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--border)}
            .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
            .logo{font-family:'Sora';font-weight:800;font-size:1.15rem}
            .logo span{color:var(--accent)}
            .nav-links{display:flex;gap:26px;list-style:none;align-items:center}
            .nav-links a{font-size:.92rem;color:var(--muted);transition:color .2s}
            .nav-links a:hover{color:var(--text)}
            .controls{display:flex;gap:10px;align-items:center}
            .pill-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,border-color .2s}
            .pill-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
            .shorts-wrap{aspect-ratio:9/16;max-height:430px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;position:relative;display:block}
            .shorts-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
            .shorts-wrap:hover img{transform:scale(1.03)}
            .shorts-wrap .play-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.3);transition:background .2s}
            .shorts-wrap:hover .play-overlay{background:rgba(0,0,0,.15)}
            .shorts-wrap .play-overlay svg{width:64px;height:64px;fill:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
            .quote-card{position:relative}
            .quote-card::before{content:"\201C";position:absolute;top:5px;right:3px;font-family:'Sora';font-size:4rem;color:color-mix(in srgb,var(--accent) 30%,transparent);line-height:1;z-index:1;pointer-events:none}
            .quote-card .who{display:flex;align-items:center;gap:12px;margin-top:18px}
            .quote-card .who i{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700;flex-shrink:0}
            .quote-card .who b{display:block;font-size:.92rem}
            .quote-card .who span{font-size:.8rem;color:var(--muted)}
            .quote-card .who .testi-link{font-size:.78rem;color:var(--accent2);display:inline-block;margin-top:2px}
            .testi-img-wrap{width:100%;height:120px;border-radius:12px;overflow:hidden;margin-bottom:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),color-mix(in srgb,var(--accent2) 25%,var(--card)));display:grid;place-items:center;border:1px solid var(--border);position:relative;z-index:0}
            .testi-img-wrap img{width:100%;height:100%;object-fit:cover}
            .burger{display:none;background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer}

            /* ===== HERO ===== */
            .hero{min-height:100vh;display:flex;align-items:center;padding-top:100px;position:relative;overflow:hidden}
            .hero::before{content:"";position:absolute;inset:0;background:
             radial-gradient(600px 400px at 82% 18%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 65%),
             radial-gradient(500px 380px at 12% 85%,color-mix(in srgb,var(--accent2) 20%,transparent),transparent 65%);pointer-events:none}
            .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative}
            .hero h1{font-size:clamp(2.3rem,5.2vw,3.8rem);font-weight:800;margin:14px 0 18px}
            .hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
            .hero p{color:var(--muted);font-size:1.08rem;max-width:540px;margin-bottom:30px}
            .cta-row{display:flex;gap:14px;flex-wrap:wrap}
            .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:12px;font-weight:600;font-size:.95rem;transition:transform .15s,box-shadow .2s;border:1px solid transparent}
            .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
            .btn-primary:hover{transform:translateY(-2px)}
            .btn-ghost{border-color:var(--border);color:var(--text);background:var(--card)}
            .btn-ghost:hover{border-color:var(--accent);transform:translateY(-2px)}
            .hero-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
            .hero-card .eq{display:flex;gap:5px;align-items:flex-end;height:70px;margin-bottom:18px}
            .hero-card .eq i{flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px;animation:eq 1.1s ease-in-out infinite}
            @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
            .hero-card h3{font-size:1.05rem;margin-bottom:6px}
            .hero-card p{font-size:.9rem;color:var(--muted);margin:0}

            /* ===== CARDS / GRID ===== */
            .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
            .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:44px}
            .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;transition:transform .2s,border-color .2s,box-shadow .2s}
            .card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:var(--shadow)}
            .card .icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;margin-bottom:16px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
            .card h3{font-size:1.12rem;margin-bottom:8px}
            .card p{font-size:.93rem;color:var(--muted)}

            /* ===== ABOUT ===== */
            .about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:52px;align-items:center}
            .about-photo{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius);aspect-ratio:4/5;display:grid;place-items:center;font-size:4rem;box-shadow:var(--shadow)}
            .stats{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}
            .stat b{font-family:'Sora';font-size:1.6rem;display:block;color:var(--accent2)}
            .stat span{font-size:.85rem;color:var(--muted)}

            /* ===== VIDEO EMBED ===== */
            .video-frame{margin-top:40px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);aspect-ratio:16/9;background:var(--card);display:grid;place-items:center;color:var(--muted)}

            /* ===== DONATE ===== */
            .donate-band{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--bg2)),color-mix(in srgb,var(--accent2) 14%,var(--bg2)));border:1px solid var(--border);border-radius:24px;padding:56px 8%;text-align:center}
            .donate-band h2{font-size:clamp(1.6rem,3vw,2.3rem);margin-bottom:12px}
            .donate-band p{color:var(--muted);max-width:560px;margin:0 auto 34px}
            .donate-links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
            .donate-link{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 24px;display:flex;align-items:center;gap:12px;font-weight:600;transition:transform .15s,border-color .2s}
            .donate-link:hover{transform:translateY(-3px);border-color:var(--accent2)}
            .donate-link .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;background:color-mix(in srgb,var(--accent2) 18%,transparent)}

            /* ===== CONTACT ===== */
            .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:48px}
            .field{margin-bottom:18px}
            label{display:block;font-size:.85rem;font-weight:600;margin-bottom:7px;color:var(--muted)}
            input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:13px 15px;font-size:.95rem;font-family:inherit;transition:border-color .2s}
            input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
            textarea{resize:vertical;min-height:140px}
            .form-note{font-size:.8rem;color:var(--muted);margin-top:12px}
            .form-ok{display:none;margin-top:16px;background:color-mix(in srgb,var(--accent2) 15%,transparent);border:1px solid color-mix(in srgb,var(--accent2) 45%,transparent);padding:14px 18px;border-radius:12px;font-size:.92rem}

            /* ===== FOOTER ===== */
            footer{border-top:1px solid var(--border);padding:38px 0;color:var(--muted);font-size:.88rem}
            .footer-inner{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
            .socials{display:flex;gap:12px}
            .socials a{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;transition:border-color .2s,transform .15s}
            .socials a:hover{border-color:var(--accent);transform:translateY(-2px)}

            .form-err {
            display: none;
            margin-top: 16px;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: .92rem;
            color: #ff6b6b;
      }

            @media(max-width:900px){
             .hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr}
             .grid-3,.grid-2{grid-template-columns:1fr}
             .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg2);flex-direction:column;padding:22px;border-bottom:1px solid var(--border)}
             .nav-links.open{display:flex}
             .burger{display:block}
            }
    </style>
  </head>
  <body>
    <nav>
      <div class="container nav-inner">
        <a
          href="#inicio"
          class="logo"
          >Oscar<span>Leites</span></a
        >
        <ul
          class="nav-links"
          id="navLinks">
          <li>
            <a
              href="#inicio"
              data-i18n="nav.home"></a>
          </li>
          <li>
            <a
              href="#sobre"
              data-i18n="nav.about"></a>
          </li>
          <li>
            <a
              href="#contenido"
              data-i18n="nav.content"></a>
          </li>
          <li>
            <a
              href="#servicios"
              data-i18n="nav.services"></a>
          </li>
          <li>
            <a
              href="#analisis"
              data-i18n="nav.analysis"></a>
          </li>
          <li>
            <a
              href="#donar"
              data-i18n="nav.donate"></a>
          </li>
          <li>
            <a
              href="#contacto"
              data-i18n="nav.contact"></a>
          </li>
        </ul>
        <div class="controls">
          <button
            class="pill-btn"
            id="langBtn"
            title="Idioma / Language">
            🌐 <span id="langLabel">EN</span>
          </button>
          <button
            class="pill-btn"
            id="themeBtn"
            title="Tema">
            🌙
          </button>
          <button
            class="burger"
            id="burger">
            ☰
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header
      class="hero"
      id="inicio">
      <div class="container hero-grid">
        <div>
          <span
            class="kicker"
            data-i18n="hero.kicker"></span>
          <h1 data-i18n-html="hero.title"></h1>
          <p data-i18n="hero.sub"></p>
          <div class="cta-row">
            <a
              class="btn btn-primary"
              href="https://www.youtube.com/@CosmeLeites"
              target="_blank"
              rel="noopener"
              >▶ <span data-i18n="hero.cta1"></span
            ></a>
            <a
              class="btn btn-ghost"
              href="#contacto"
              data-i18n="hero.cta2"></a>
          </div>
        </div>
        <div
          class="hero-card"
          style="padding:14px">
          <div
            class="shorts-wrap"
            style="aspect-ratio: 9 / 16; max-height: 430px;">
            <iframe
              style="width: 100%; height: 100%; border: 0;"
              src="https://www.youtube.com/embed/uP0gKhBpLCw"
              title="YouTube Short"
              frameborder="0"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>
          </div>
          <p
            style="margin:14px 4px 4px;text-align:center;font-size:.88rem"
            data-i18n="hero.cardText"></p>
          <p style="text-align:center;margin-top:6px;font-size:.8rem;">
            <a
              href="https://www.youtube.com/@CosmeLeites"
              target="_blank"
              rel="noopener"
              style="color:var(--accent2);"
              data-i18n="hero.channelLink"></a>
          </p>
        </div>
      </div>
    </header>

    <!-- SOBRE MÍ -->
    <section id="sobre">
      <div class="container about-grid">
        <img
          src="./img/oscar-perfil.png"
          alt="Oscar Leites"
          style="border-radius:var(--radius);box-shadow:var(--shadow);width:100%;aspect-ratio:1/1;object-fit:cover" />
        <div>
          <span
            class="kicker"
            data-i18n="about.kicker"></span>
          <h2
            class="section-title"
            data-i18n="about.title"></h2>
          <p
            class="lead"
            data-i18n="about.p1"></p>
          <br />
          <p
            class="lead"
            data-i18n="about.p2"></p>
          <div class="stats">
            <div class="stat"><b>+100</b><span data-i18n="about.stat1"></span></div>
            <div class="stat"><b>+30</b><span data-i18n="about.stat2"></span></div>
            <div class="stat"><b>2</b><span data-i18n="about.stat3"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTENIDO (YOUTUBE + REELS) -->
    <section
      id="contenido"
      style="background:var(--bg2)">
      <div class="container">
        <span
          class="kicker"
          data-i18n="content.kicker"></span>
        <h2
          class="section-title"
          data-i18n="content.title"></h2>
        <p
          class="lead"
          data-i18n="content.sub"></p>
        <div class="grid-3">
          <div class="card">
            <div class="icon">🎬</div>
            <h3 data-i18n="content.c1t"></h3>
            <p data-i18n="content.c1p"></p>
          </div>
          <div class="card">
            <div class="icon">📱</div>
            <h3 data-i18n="content.c2t"></h3>
            <p data-i18n="content.c2p"></p>
          </div>
          <div class="card">
            <div class="icon">🎧</div>
            <h3 data-i18n="content.c3t"></h3>
            <p data-i18n="content.c3p"></p>
          </div>
        </div>
        <div
          class="video-frame"
          id="videoFrame">
          <iframe
            src="https://www.youtube.com/embed/QwLV9mrVI8A"
            title="YouTube video player"
            style="width: 100%; height: 100%; border: 0;"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </section>

    <!-- SERVICIOS -->
    <section id="servicios">
      <div class="container">
        <span
          class="kicker"
          data-i18n="services.kicker"></span>
        <h2
          class="section-title"
          data-i18n="services.title"></h2>
        <p
          class="lead"
          data-i18n="services.sub"></p>
        <div class="grid-2">
          <div class="card">
            <div class="icon">🎮</div>
            <h3 data-i18n="services.s1t"></h3>
            <p data-i18n="services.s1p"></p>
          </div>
          <div class="card">
            <div class="icon">🧭</div>
            <h3 data-i18n="services.s2t"></h3>
            <p data-i18n="services.s2p"></p>
          </div>
          <div class="card">
            <div class="icon">🌍</div>
            <h3 data-i18n="services.s3t"></h3>
            <p data-i18n="services.s3p"></p>
          </div>
          <div class="card">
            <div class="icon">🤝</div>
            <h3 data-i18n="services.s4t"></h3>
            <p data-i18n="services.s4p"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ANÁLISIS -->
    <section
      id="analisis"
      style="background:var(--bg2)">
      <div class="container">
        <span
          class="kicker"
          data-i18n="analysis.kicker"></span>
        <h2
          class="section-title"
          data-i18n="analysis.title"></h2>
        <p
          class="lead"
          data-i18n="analysis.sub"></p>
        <div class="grid-2">
          <div class="card">
            <div class="icon">⚔️</div>
            <h3 data-i18n="analysis.a1t"></h3>
            <p data-i18n="analysis.a1p"></p>
          </div>
          <div class="card">
            <div class="icon">🪕</div>
            <h3 data-i18n="analysis.a2t"></h3>
            <p data-i18n="analysis.a2p"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- TESTIMONIOS -->
    <section id="testimonios">
      <div class="container">
        <span
          class="kicker"
          data-i18n="testi.kicker"></span>
        <h2
          class="section-title"
          data-i18n="testi.title"></h2>
        <p
          class="lead"
          data-i18n="testi.sub"></p>
        <div class="grid-3">
          <!-- 1: Astra Noctis -->
          <div class="card quote-card">
            <div class="testi-img-wrap">
              <img
                src="img/astra-noctis.png"
                alt="Astra Noctis"
                onerror="this.style.display='none'" />
            </div>
            <p
              style="font-size:.95rem"
              data-i18n="testi.t1"></p>
            <div class="who">
              <i>M</i>
              <div>
                <b>Matias</b>
                <span data-i18n="testi.r1"></span>
                <a
                  href="https://store.steampowered.com/app/3195830/Astra_Noctis_Demo/"
                  target="_blank"
                  rel="noopener"
                  class="testi-link"
                  data-i18n="testi.l1"></a>
              </div>
            </div>
          </div>

          <!-- 2: Carthage -->
          <div class="card quote-card">
            <div class="testi-img-wrap">
              <img
                src="img/carthage.png"
                alt="Carthage: Bellum Punicum"
                onerror="this.style.display='none'" />
            </div>
            <p
              style="font-size:.95rem"
              data-i18n="testi.t2"></p>
            <div class="who">
              <i>M</i>
              <div>
                <b>Mendog</b>
                <span data-i18n="testi.r2"></span>
                <a
                  href="https://bit.ly/CarthageBellumPunicum"
                  target="_blank"
                  rel="noopener"
                  class="testi-link"
                  data-i18n="testi.l2"></a>
              </div>
            </div>
          </div>

          <!-- 3: Towerful Defense (Mini Fun Games) -->
          <div class="card quote-card">
            <div class="testi-img-wrap">
              <img
                src="img/towerful-defense.png"
                alt="Towerful Defense"
                onerror="this.style.display='none'" />
            </div>
            <p
              style="font-size:.95rem"
              data-i18n="testi.t3"></p>
            <div class="who">
              <i>F</i>
              <div>
                <b>FVS</b>
                <span data-i18n="testi.r3"></span>
                <a
                  href="https://minifun.games/"
                  target="_blank"
                  rel="noopener"

                  /* ================== FORM (fetch a Formspree, sin recargar) ================== */
                 document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Evita que la página se recargue

        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        const formOk = document.getElementById('formOk');
        const formErr = document.getElementById('formErr');

        // Ocultar mensajes previos
        formOk.style.display = 'none';
        formErr.style.display = 'none';
        btn.disabled = true; // Deshabilitar botón para evitar doble clic

        try {
          const formData = new FormData(form);
          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          const result = await response.json();

          if (response.ok) {
            formOk.style.display = 'block';
            form.reset(); // Limpiar el formulario
          } else {
            formErr.textContent = result.message || 'Error al enviar.';
            formErr.style.display = 'block';
          }
        } catch (error) {
          formErr.style.display = 'block';
        } finally {
          btn.disabled = false; // Volver a habilitar el botón
        }
      });
