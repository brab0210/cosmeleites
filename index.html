    /* ============================================================
       LANGUAGE
    ============================================================ */
    let lang = localStorage.getItem('ol-lang') || 'en';

    function setLang(l) {
      lang = l;
      localStorage.setItem('ol-lang', l);
      document.documentElement.lang = l;
      document.getElementById('langLabel').textContent = l === 'es' ? 'EN' : 'ES';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (I18N[l][k] !== undefined) el.textContent = I18N[l][k];
      });

      // Update video card labels
      document.querySelectorAll('.video-card').forEach(card => {
        const titleKey = l === 'es' ? 'titleEs' : 'titleEn';
        const catKey = l === 'es' ? 'catEs' : 'catEn';
        const titleEl = card.querySelector('.video-title');
        const catEl = card.querySelector('.video-cat-label');
        if (titleEl) titleEl.textContent = card.dataset[titleKey] || '';
        if (catEl) catEl.textContent = card.dataset[catKey] || '';
      });
    }

    document.getElementById('langBtn').addEventListener('click', () => setLang(lang === 'es' ? 'en' : 'es'));

    /* ============================================================
       THEME
    ============================================================ */
    let theme = localStorage.getItem('ol-theme') || 'dark';

    function setTheme(t) {
      theme = t;
      localStorage.setItem('ol-theme', t);
      document.documentElement.dataset.theme = t;
      document.getElementById('themeMoon').style.display = t === 'dark' ? 'block' : 'none';
      document.getElementById('themeSun').style.display = t === 'dark' ? 'none' : 'block';
    }

    document.getElementById('themeBtn').addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));

    /* ============================================================
       MOBILE NAV
    ============================================================ */
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');

    burger.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      burger.setAttribute('aria-expanded', String(isOpen));
    });

    navLinks.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        navLinks.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });

    /* ============================================================
       STICKY NAV — scroll behavior
    ============================================================ */
    const mainNav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
      mainNav.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    /* ============================================================
       SCROLL REVEAL
    ============================================================ */
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const revealObs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));
    } else {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    }

    /* ============================================================
       VIDEO GALLERY — lazy iframe loading
    ============================================================ */
    document.querySelectorAll('.video-card').forEach(card => {
      const videoId = card.dataset.videoId;
      const overlay = card.querySelector('.video-overlay');
      const thumb = card.querySelector('.video-thumb');

      if (!videoId) return;

      const loadVideo = () => {
        // Replace thumb + overlay with iframe
        const wrapper = card.querySelector('.video-thumb-wrap');
        const iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1';
        iframe.title = card.dataset[lang === 'es' ? 'titleEs' : 'titleEn'] || 'YouTube video';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.cssText = 'width:100%;height:100%;border:0;display:block;';
        iframe.setAttribute('loading', 'lazy');

        wrapper.style.position = 'relative';
        wrapper.style.paddingBottom = '56.25%';
        wrapper.style.height = '0';
        wrapper.style.overflow = 'hidden';
        wrapper.innerHTML = '';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
        wrapper.appendChild(iframe);
      };

      overlay.addEventListener('click', loadVideo);
      thumb.addEventListener('click', loadVideo);
    });

    /* ============================================================
       CONTACT FORM
    ============================================================ */
    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      const formOk = document.getElementById('formOk');
      const formErr = document.getElementById('formErr');

      formOk.style.display = 'none';
      formErr.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '…';

      try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });
        const result = await response.json();
        if (response.ok) {
          formOk.style.display = 'block';
          form.reset();
        } else {
          formErr.textContent = result.message || 'Error sending message.';
          formErr.style.display = 'block';
        }
      } catch {
        formErr.textContent = lang === 'es'
          ? 'Hubo un error al enviar. Por favor, intentá de nuevo.'
          : 'There was an error sending the message. Please try again.';
        formErr.style.display = 'block';
      } finally {
        btn.disabled = false;
        setLang(lang); // restore button label
      }
    });

    /* ============================================================
       INIT
    ============================================================ */
    setTheme(theme);
    setLang(lang);
  </script>
